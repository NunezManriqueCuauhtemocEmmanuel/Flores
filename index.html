<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores para Irene 💛</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <p class="prompt" id="prompt">Elige tus flores, Irene hermosa 💛</p>

    <div class="choice-row" id="choiceRow">
      <button class="grow-btn" id="sunflowerBtn">🌻 Flores amarillas</button>
      <button class="grow-btn rose-btn" id="roseBtn">🌹 Ramo de rosas</button>
    </div>

    <div class="bouquet-wrap">
      <svg class="bouquet" id="bouquet" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>

    <div class="message" id="message">
      <p class="tqm" id="tqmText">TQM Irene 💛</p>
      <p class="subtext" id="subText">Te quiero mucho, mereces todas las flores del mundo 💛, la niña más bonita de todas</p>
      <div class="action-row">
        <button class="again-btn" id="againBtn">volver a florecer</button>
        <button class="switch-btn" id="switchBtn">elegir otras flores</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
